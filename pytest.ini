[pytest]
python_files = test*.py
testpaths = tests
markers =
  clientData(group): checks the client's own data, in one of the groups survey, clientFiles, calibration; a whole-suite run takes it only when the group's code changed (tests/conftest.py heavyGroups), -m clientData always
  install: installs Blender and extensions for real, over the network; a whole-suite run takes it only when the sync code changed, -m install always
