[pytest]
python_files = test*.py
testpaths = tests
markers =
  clientData(group): checks the client's own data, in one of the groups survey, clientFiles, calibration, or (the server's own data) serverNav; a whole-suite run takes it only when the group's code changed (tests/conftest.py heavyGroups), -m clientData always
  install: installs Blender, extensions, and the Recast helper for real, over the network; a whole-suite run takes it only when the sync code changed, -m install always
